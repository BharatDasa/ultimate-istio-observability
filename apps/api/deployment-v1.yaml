apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v1
  namespace: istio-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
      version: v1
  template:
    metadata:
      labels:
        app: api
        version: v1
    spec:
      containers:
        - name: api
          image: bharatdasa/api:v1
          ports:
            - containerPort: 5000
