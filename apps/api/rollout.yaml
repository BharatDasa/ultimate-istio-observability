apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  namespace: istio-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        version: v2
    spec:
      containers:
        - name: api
          image: bharatdasa/api:v2
          ports:
            - containerPort: 5000
  strategy:
    canary:
      trafficRouting:
        istio:
          virtualService:
            name: api
            routes:
              - primary
      steps:
        - setWeight: 10
        - pause: { duration: 30 }
        - setWeight: 50
        - pause: { duration: 30 }
        - setWeight: 100
