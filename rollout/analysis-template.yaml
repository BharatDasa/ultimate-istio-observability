apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate

metadata:
  name: latency-check
  namespace: istio-demo

spec:
  metrics:
    - name: latency

      interval: 30s

      successCondition: result < 500

      failureCondition: result >= 500

      provider:
        prometheus:
          address: http://prometheus-monitoring-kube-prometheus-prometheus.monitoring:9090

          query: |
            histogram_quantile(
              0.95,
              sum(
                rate(
                  istio_request_duration_milliseconds_bucket[1m]
                )
              ) by (le)
            )