apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: istio-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: bharatdasa/worker:v1
          ports:
            - containerPort: 5000
